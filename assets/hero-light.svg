<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
<title id="t">Felix Fang — Agent Control Room. Today's scene: Premiere.</title>
<desc id="d">Wide cinematic banner. Felix Fang, engineer: agents run the ops, I keep the judgment. Building Become Human, portable and correctable memory for agents. Scene art: Premiere.</desc>
<style>
.trace{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 4s ease forwards}
.draw{stroke-dasharray:700;stroke-dashoffset:700;animation:draw 3.5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.eq{transform-box:fill-box;transform-origin:bottom;animation:eq 1.3s ease-in-out infinite alternate}
@keyframes eq{0%{transform:scaleY(.15)}50%{transform:scaleY(.8)}100%{transform:scaleY(.35)}}
.beam{animation:flick 3s ease-in-out infinite alternate}.b2{animation-delay:-1.5s}@keyframes flick{to{opacity:.02}}
.breathe{transform-box:fill-box;transform-origin:center;animation:br 6s ease-in-out infinite}@keyframes br{50%{transform:scale(1.08);opacity:.15}}
.msg{opacity:0;animation:in .5s ease forwards}.m1{animation-delay:.3s}.m2{animation-delay:1.2s}.m3{animation-delay:2.1s}.m4{animation-delay:3s}
@keyframes in{to{opacity:1}}.cat{animation:walk 28s linear infinite}@keyframes walk{from{transform:translateX(-30px)}to{transform:translateX(1230px)}}.cursor{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect class="bg" width="1200" height="360" fill="#ffffff"/>
<rect width="1200" height="30" fill="#eef1f5"/><rect y="330" width="1200" height="30" fill="#eef1f5"/>
<text x="40" y="20" fill="#6e7781" font-size="11" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace">AGENT CONTROL ROOM · SCENE 6/6 · <tspan fill="#1f2328">PREMIERE</tspan></text>
<text x="1160" y="20" text-anchor="end" font-size="11" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace"><tspan fill="#6e7781">○ FOCUS</tspan><tspan>   </tspan><tspan fill="#6e7781">○ RECOVERY</tspan><tspan>   </tspan><tspan fill="#d97706">● FUN</tspan></text>
<text x="56" y="88" fill="#d97706" font-size="13" font-weight="600" letter-spacing="4">ENGINEER · AGENT BUILDER · HEAVY USER</text>
<text x="54" y="146" fill="#1f2328" font-size="54" font-weight="800" letter-spacing="-1">Felix Fang</text>
<text x="56" y="186" fill="#1f2328" font-size="22" font-weight="500">Agents run the ops. I keep the judgment.</text>
<text x="56" y="216" fill="#59636e" font-size="15">Building <tspan fill="#1f2328" font-weight="600">Become Human</tspan>: portable, private, correctable memory for agents.</text>
<text x="56" y="246" fill="#59636e" font-size="15" font-style="italic">“Widescreen ideas, frame by frame.”</text>
<text x="56" y="300" fill="#59636e" font-size="13" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace"><tspan fill="#d97706">$</tspan> last push → maptaste   ·   26 public repos <tspan class="cursor" fill="#d97706">▍</tspan></text>
<g transform="translate(720 56)"><rect x="150" y="10" width="290" height="160" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
<path class="beam" d="M0 230 L150 20 V160 Z" fill="#d97706" opacity=".14"/>
<circle cx="8" cy="226" r="9" fill="#d97706"/>
<text x="295" y="84" text-anchor="middle" fill="#d97706" font-size="22" font-weight="700" letter-spacing="6">NOW SHOWING</text>
<text x="295" y="114" text-anchor="middle" fill="#59636e" font-size="14" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace">ops by agents · judgment by me</text>
<rect x="160" y="186" width="20" height="14" rx="2" fill="#d8dee4"/><rect x="191" y="186" width="20" height="14" rx="2" fill="#d8dee4"/><rect x="222" y="186" width="20" height="14" rx="2" fill="#d8dee4"/><rect x="253" y="186" width="20" height="14" rx="2" fill="#d8dee4"/><rect x="284" y="186" width="20" height="14" rx="2" fill="#d8dee4"/><rect x="315" y="186" width="20" height="14" rx="2" fill="#d8dee4"/><rect x="346" y="186" width="20" height="14" rx="2" fill="#d8dee4"/><rect x="377" y="186" width="20" height="14" rx="2" fill="#d8dee4"/><rect x="408" y="186" width="20" height="14" rx="2" fill="#d8dee4"/></g>
