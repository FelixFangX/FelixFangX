<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
<title id="t">Felix Fang — Agent Control Room. Today's scene: Deep work.</title>
<desc id="d">Wide cinematic banner. Felix Fang, engineer: agents run the ops, I keep the judgment. Building Become Human, portable and correctable memory for agents. Scene art: Deep work.</desc>
<style>
.trace{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 4s ease forwards}
.draw{stroke-dasharray:700;stroke-dashoffset:700;animation:draw 3.5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.eq{transform-box:fill-box;transform-origin:bottom;animation:eq 1.3s ease-in-out infinite alternate}
@keyframes eq{0%{transform:scaleY(.15)}50%{transform:scaleY(.8)}100%{transform:scaleY(.35)}}
.beam{animation:flick 3s ease-in-out infinite alternate}.b2{animation-delay:-1.5s}@keyframes flick{to{opacity:.02}}
.breathe{transform-box:fill-box;transform-origin:center;animation:br 6s ease-in-out infinite}@keyframes br{50%{transform:scale(1.08);opacity:.15}}
.msg{opacity:0;animation:in .5s ease forwards}.m1{animation-delay:.3s}.m2{animation-delay:1.2s}.m3{animation-delay:2.1s}.m4{animation-delay:3s}
@keyframes in{to{opacity:1}}.cat{animation:walk 28s linear infinite}@keyframes walk{from{transform:translateX(-30px)}to{transform:translateX(1230px)}}.cursor{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect class="bg" width="1200" height="360" fill="#ffffff"/>
<rect width="1200" height="30" fill="#eef1f5"/><rect y="330" width="1200" height="30" fill="#eef1f5"/>
<text x="40" y="20" fill="#6e7781" font-size="11" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace">AGENT CONTROL ROOM · SCENE 1/6 · <tspan fill="#1f2328">DEEP WORK</tspan></text>
<text x="1160" y="20" text-anchor="end" font-size="11" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace"><tspan fill="#7c3aed">● FOCUS</tspan><tspan>   </tspan><tspan fill="#6e7781">○ RECOVERY</tspan><tspan>   </tspan><tspan fill="#6e7781">○ FUN</tspan></text>
<text x="56" y="88" fill="#7c3aed" font-size="13" font-weight="600" letter-spacing="4">ENGINEER · AGENT BUILDER · HEAVY USER</text>
<text x="54" y="146" fill="#1f2328" font-size="54" font-weight="800" letter-spacing="-1">Felix Fang</text>
<text x="56" y="186" fill="#1f2328" font-size="22" font-weight="500">Agents run the ops. I keep the judgment.</text>
<text x="56" y="216" fill="#59636e" font-size="15">Building <tspan fill="#1f2328" font-weight="600">Become Human</tspan>: portable, private, correctable memory for agents.</text>
<text x="56" y="246" fill="#59636e" font-size="15" font-style="italic">“Spec first. Then slices. Then code.”</text>
<text x="56" y="300" fill="#59636e" font-size="13" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace"><tspan fill="#7c3aed">$</tspan> last push → maptaste   ·   7 public repos <tspan class="cursor" fill="#7c3aed">▍</tspan></text>
