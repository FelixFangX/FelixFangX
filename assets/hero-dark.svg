<text x="40" y="20" fill="#6e7681" font-size="11" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace">AGENT CONTROL ROOM · SCENE 2/6 · <tspan fill="#e6edf3">LIVE SET</tspan></text>
<text x="1160" y="20" text-anchor="end" font-size="11" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace"><tspan fill="#6e7681">○ FOCUS</tspan><tspan>   </tspan><tspan fill="#6e7681">○ RECOVERY</tspan><tspan>   </tspan><tspan fill="#f472b6">● FUN</tspan></text>
<text x="56" y="88" fill="#f472b6" font-size="13" font-weight="600" letter-spacing="4">ENGINEER · AGENT BUILDER · HEAVY USER</text>
<text x="54" y="146" fill="#e6edf3" font-size="54" font-weight="800" letter-spacing="-1">Felix Fang</text>
<text x="56" y="186" fill="#e6edf3" font-size="22" font-weight="500">Agents run the ops. I keep the judgment.</text>
<text x="56" y="216" fill="#8b949e" font-size="15">Building <tspan fill="#e6edf3" font-weight="600">Become Human</tspan>: portable, private, correctable memory for agents.</text>
<text x="56" y="246" fill="#8b949e" font-size="15" font-style="italic">“Loud room, clear head.”</text>
<text x="56" y="300" fill="#8b949e" font-size="13" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace"><tspan fill="#f472b6">$</tspan> last push → ledring   ·   8 public repos <tspan class="cursor" fill="#f472b6">▍</tspan></text>
