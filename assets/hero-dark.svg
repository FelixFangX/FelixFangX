<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
<title id="t">Felix Fang — Agent Control Room. Today's scene: Recovery.</title>
<desc id="d">Wide cinematic banner. Felix Fang, engineer: agents run the ops, I keep the judgment. Building Become Human, portable and correctable memory for agents. Scene art: Recovery.</desc>
<style>
.trace{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 4s ease forwards}
.draw{stroke-dasharray:700;stroke-dashoffset:700;animation:draw 3.5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.eq{transform-box:fill-box;transform-origin:bottom;animation:eq 1.3s ease-in-out infinite alternate}
@keyframes eq{0%{transform:scaleY(.15)}50%{transform:scaleY(.8)}100%{transform:scaleY(.35)}}
.beam{animation:flick 3s ease-in-out infinite alternate}.b2{animation-delay:-1.5s}@keyframes flick{to{opacity:.02}}
.breathe{transform-box:fill-box;transform-origin:center;animation:br 6s ease-in-out infinite}@keyframes br{50%{transform:scale(1.08);opacity:.15}}
.msg{opacity:0;animation:in .5s ease forwards}.m1{animation-delay:.3s}.m2{animation-delay:1.2s}.m3{animation-delay:2.1s}.m4{animation-delay:3s}
@keyframes in{to{opacity:1}}.cat{animation:walk 28s linear infinite}@keyframes walk{from{transform:translateX(-30px)}to{transform:translateX(1230px)}}.cursor{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect class="bg" width="1200" height="360" fill="#0b0f17"/>
<rect width="1200" height="30" fill="#000000"/><rect y="330" width="1200" height="30" fill="#000000"/>
<text x="40" y="20" fill="#6e7681" font-size="11" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace">AGENT CONTROL ROOM · SCENE 4/6 · <tspan fill="#e6edf3">RECOVERY</tspan></text>
<text x="1160" y="20" text-anchor="end" font-size="11" letter-spacing="3" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace"><tspan fill="#6e7681">○ FOCUS</tspan><tspan>   </tspan><tspan fill="#2dd4bf">● RECOVERY</tspan><tspan>   </tspan><tspan fill="#6e7681">○ FUN</tspan></text>
<text x="56" y="88" fill="#2dd4bf" font-size="13" font-weight="600" letter-spacing="4">ENGINEER · AGENT BUILDER · HEAVY USER</text>
<text x="54" y="146" fill="#e6edf3" font-size="54" font-weight="800" letter-spacing="-1">Felix Fang</text>
<text x="56" y="186" fill="#e6edf3" font-size="22" font-weight="500">Agents run the ops. I keep the judgment.</text>
<text x="56" y="216" fill="#8b949e" font-size="15">Building <tspan fill="#e6edf3" font-weight="600">Become Human</tspan>: portable, private, correctable memory for agents.</text>
<text x="56" y="246" fill="#8b949e" font-size="15" font-style="italic">“Rest is part of the plan.”</text>
<text x="56" y="300" fill="#8b949e" font-size="13" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace"><tspan fill="#2dd4bf">$</tspan> last push → dashtaste   ·   15 public repos <tspan class="cursor" fill="#2dd4bf">▍</tspan></text>
<g transform="translate(720 56)"><circle class="breathe" style="animation-delay:-0s" cx="220" cy="125" r="36" fill="none" stroke="#2dd4bf" opacity="0.6" stroke-width="2"/><circle class="breathe" style="animation-delay:-1.5s" cx="220" cy="125" r="60" fill="none" stroke="#2dd4bf" opacity="0.48" stroke-width="2"/><circle class="breathe" style="animation-delay:-3s" cx="220" cy="125" r="84" fill="none" stroke="#2dd4bf" opacity="0.36" stroke-width="2"/><circle class="breathe" style="animation-delay:-4.5s" cx="220" cy="125" r="108" fill="none" stroke="#2dd4bf" opacity="0.24" stroke-width="2"/><circle cx="220" cy="125" r="10" fill="#2dd4bf"/><text x="220" y="250" text-anchor="middle" fill="#8b949e" font-size="13" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace">inhale · hold · exhale</text></g>
<g id="motif-cat" class="cat" aria-hidden="true"><g transform="translate(0 338)"><rect x="6" y="0" width="3" height="3" fill="#6e7681"/><rect x="18" y="0" width="3" height="3" fill="#6e7681"/><rect x="6" y="3" width="3" height="3" fill="#6e7681"/><rect x="9" y="3" width="3" height="3" fill="#6e7681"/><rect x="12" y="3" width="3" height="3" fill="#6e7681"/><rect x="15" y="3" width="3" height="3" fill="#6e7681"/><rect x="18" y="3" width="3" height="3" fill="#6e7681"/><rect x="0" y="6" width="3" height="3" fill="#6e7681"/><rect x="6" y="6" width="3" height="3" fill="#6e7681"/><rect x="12" y="6" width="3" height="3" fill="#6e7681"/><rect x="18" y="6" width="3" height="3" fill="#6e7681"/><rect x="0" y="9" width="3" height="3" fill="#6e7681"/><rect x="6" y="9" width="3" height="3" fill="#6e7681"/><rect x="9" y="9" width="3" height="3" fill="#6e7681"/><rect x="12" y="9" width="3" height="3" fill="#6e7681"/><rect x="15" y="9" width="3" height="3" fill="#6e7681"/><rect x="18" y="9" width="3" height="3" fill="#6e7681"/><rect x="3" y="12" width="3" height="3" fill="#6e7681"/><rect x="6" y="12" width="3" height="3" fill="#6e7681"/><rect x="9" y="12" width="3" height="3" fill="#6e7681"/><rect x="12" y="12" width="3" height="3" fill="#6e7681"/><rect x="15" y="12" width="3" height="3" fill="#6e7681"/><rect x="18" y="12" width="3" height="3" fill="#6e7681"/><rect x="3" y="15" width="3" height="3" fill="#6e7681"/><rect x="9" y="15" width="3" height="3" fill="#6e7681"/><rect x="15" y="15" width="3" height="3" fill="#6e7681"/><rect x="21" y="15" width="3" height="3" fill="#6e7681"/></g></g>
</svg>
