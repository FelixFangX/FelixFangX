<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="t d" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
<title id="t">Two layers: agents handle operations, the human keeps judgment</title>
<desc id="d">Agent layer: research pipeline, workflow automations, daily digest, file conversion. Human layer: write the spec, set the seams, review against evidence, decide what ships. Specs flow down to agents, evidence flows back up.</desc>
<style>.flow{stroke-dasharray:6 8;animation:f 1.4s linear infinite}.up{animation-direction:reverse}@keyframes f{to{stroke-dashoffset:-14}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect class="bg" width="1200" height="290" fill="#0b0f17"/>
<g transform="translate(0 0)">
<rect x="0" y="20" width="460" height="250" rx="14" fill="#111827" stroke="#273142"/>
<rect x="0" y="20" width="6" height="250" rx="3" fill="#a78bfa"/>
<text x="28" y="56" fill="#a78bfa" font-size="12" font-weight="700" letter-spacing="3">AGENT LAYER</text>
<text x="28" y="80" fill="#e6edf3" font-size="18" font-weight="600">Handles the ops</text>
<text x="28" y="120" fill="#e6edf3" font-size="14" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace">research-thinking-ai</text><text x="440" y="120" text-anchor="end" fill="#8b949e" font-size="13">vague topic → evidence</text><text x="28" y="156" fill="#e6edf3" font-size="14" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace">n8n-workflow-collection</text><text x="440" y="156" text-anchor="end" fill="#8b949e" font-size="13">Lark / Bitable flows</text><text x="28" y="192" fill="#e6edf3" font-size="14" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace">tech-news-digest</text><text x="440" y="192" text-anchor="end" fill="#8b949e" font-size="13">daily ranked digest</text><text x="28" y="228" fill="#e6edf3" font-size="14" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace">lakeboard-converter</text><text x="440" y="228" text-anchor="end" fill="#8b949e" font-size="13">mind maps → Markdown</text>
</g>
<g transform="translate(740 0)">
<rect x="0" y="20" width="460" height="250" rx="14" fill="#111827" stroke="#273142"/>
<rect x="0" y="20" width="6" height="250" rx="3" fill="#fbbf24"/>
<text x="28" y="56" fill="#fbbf24" font-size="12" font-weight="700" letter-spacing="3">HUMAN LAYER</text>
<text x="28" y="80" fill="#e6edf3" font-size="18" font-weight="600">Keeps the judgment</text>
<text x="28" y="120" fill="#e6edf3" font-size="14" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace">spec</text><text x="440" y="120" text-anchor="end" fill="#8b949e" font-size="13">problem, stories, scope</text><text x="28" y="156" fill="#e6edf3" font-size="14" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace">seams</text><text x="440" y="156" text-anchor="end" fill="#8b949e" font-size="13">what gets tested, where</text><text x="28" y="192" fill="#e6edf3" font-size="14" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace">review</text><text x="440" y="192" text-anchor="end" fill="#8b949e" font-size="13">standards + spec, two axes</text><text x="28" y="228" fill="#e6edf3" font-size="14" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace">decide</text><text x="440" y="228" text-anchor="end" fill="#8b949e" font-size="13">what ships, what doesn’t</text>
</g>
<g font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif"><text x="600" y="92" text-anchor="middle" fill="#8b949e" font-size="12" letter-spacing="2">HANDOFF</text>
<line class="flow" x1="480" y1="135" x2="720" y2="135" stroke="#fbbf24" stroke-width="2"/><text x="600" y="125" text-anchor="middle" fill="#e6edf3" font-size="13">◂ spec + context</text>
<line class="flow up" x1="480" y1="205" x2="720" y2="205" stroke="#a78bfa" stroke-width="2"/><text x="600" y="230" text-anchor="middle" fill="#e6edf3" font-size="13">evidence + diffs ▸</text></g>
</svg>
