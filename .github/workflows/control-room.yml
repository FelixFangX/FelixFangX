name: control-room
on:
  schedule: [{ cron: "5 16 * * *" }]   # just after midnight UTC+8: new scene each day
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/*.test.mjs
      - run: node src/build.mjs
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: |
          git add README.md assets llms.txt status.json
          git diff --cached --quiet && exit 0
          git config user.name "control-room[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): daily scene, agent log and system map" && git push
